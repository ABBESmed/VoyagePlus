<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - VoyagePlus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--header-->
    <header class="header">
        <h1 class="logo">VoyagePlus</h1>
        <button class="burger" id="burger">☰</button>
        <nav class="nav" id="nav">
            <a href="index.html">Accueil</a>
            <a href="voyage.html">Voyage</a>
            <a href="activites.html">Activités</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="buttons" id="buttons">
            <a href="connexion.html" class="btn-login">Connexion</a>
            <a href="inscription.html" class="btn-register">Inscription</a>
        </div>
    </header>

    <!--Inscription Section-->

    <section class="auth-page">
        <form class="auth-form">
            <h2>Inscription</h2>
            <p>Créez votre compte VoyagePlus.</p>

            <label for="nom">Nom complet</label>
            <input type="text" id="nom" placeholder="Votre nom complet">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Votre email">

            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="Votre mot de passe">

            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" placeholder="Confirmez votre mot de passe">

            <button type="submit">Créer un compte</button>

            <p class="auth-link">
                Déjà un compte ?
                <a href="connexion.html">Se connecter</a>
            </p>
        </form>
    </section>

    <!--footer-->
    <footer class="footer">
        <div class="footer-content">
            <h2>VoyagePlus</h2>
            <p>Découvrez le monde avec nous et réservez vos plus beaux voyages.</p>

            <div class="footer-links">
                <a href="index.html">Accueil</a>
                <a href="voyage.html">Voyage</a>
                <a href="activites.html">Activités</a>
                <a href="contact.html">Contact</a>
            </div>

            <p class="copyright">&copy; 2026 VoyagePlus. Tous droits réservés.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
